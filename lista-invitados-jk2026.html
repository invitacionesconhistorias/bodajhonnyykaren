<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Invitados Jhonny & Karen</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cinzel:wght@500&display=swap" rel="stylesheet">
<style>
:root{--wa:#5d6a2f;--waTx:#fff;--bg:#f6f1e4;--card:#fffdf7;--ol:#4d5a2c;--ol2:#6b7a3e;--oro:#b8955a;--tx:#3f4628;--mut:#7a7c64;--line:rgba(184,149,90,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f12;--card:#252a19;--ol:#c9d49a;--ol2:#aab779;--oro:#d9b877;--tx:#ecebd8;--mut:#b4b59a;--line:rgba(217,184,119,.3);--wa:#aab779;--waTx:#1b1f12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1f12;--card:#252a19;--ol:#c9d49a;--ol2:#aab779;--oro:#d9b877;--tx:#ecebd8;--mut:#b4b59a;--line:rgba(217,184,119,.3);--wa:#aab779;--waTx:#1b1f12;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Cormorant Garamond',Georgia,serif;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{text-wrap:balance}.pill,.num{font-variant-numeric:tabular-nums}
button:focus-visible,a.wa:focus-visible,.chk input:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
li>div{min-width:0}
@media (prefers-reduced-motion:reduce){.toast,.bar i{transition:none}}
header{text-align:center;padding:28px 0 18px}
header small{font-family:Cinzel,serif;letter-spacing:.24em;font-size:.72rem;color:var(--oro)}
h1{font-weight:600;font-size:2rem;color:var(--ol);margin:.2rem 0}
.sum{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.pill{font-family:Cinzel,serif;font-size:.7rem;letter-spacing:.1em;padding:.4rem .8rem;border-radius:20px;border:1px solid var(--line);color:var(--ol2);background:var(--card)}
.bar{height:6px;border-radius:6px;background:var(--line);max-width:420px;margin:14px auto 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ol2);width:0;transition:width .4s}
ul{list-style:none;max-width:560px;margin:18px auto 0;display:flex;flex-direction:column;gap:10px}
li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
li.done{opacity:.55}
.num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:.75rem;color:var(--oro);border:1px solid var(--line)}
.nm{font-size:1.2rem;font-weight:600;line-height:1.2}
.cp{font-family:Cinzel,serif;font-size:.66rem;letter-spacing:.12em;color:var(--mut);margin-top:2px}
.acts{display:flex;gap:6px}
button,a.wa{border:1px solid var(--line);background:transparent;color:var(--ol);border-radius:10px;height:38px;min-width:38px;padding:0 10px;font-family:Cinzel,serif;font-size:.62rem;letter-spacing:.08em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}
a.wa{background:var(--wa);color:var(--waTx);border-color:var(--wa)}
button svg,a.wa svg{width:16px;height:16px}
.chk{grid-column:2/4;display:flex;align-items:center;gap:8px;font-size:1rem;color:var(--mut);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--ol2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(80px);background:var(--ol);color:var(--bg);padding:.6rem 1.1rem;border-radius:20px;font-family:Cinzel,serif;font-size:.7rem;letter-spacing:.1em;transition:transform .3s}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header><small>BODA · 12 · 12 · 2026</small><h1>Jhonny &amp; Karen</h1><p style="font-style:italic;color:var(--mut)">Invitaciones personalizadas para enviar</p>
<div class="sum"><span class="pill" id="sInv"></span><span class="pill" id="sCup"></span><span class="pill" id="sEnv"></span></div><div class="bar"><i id="prog"></i></div></header>
<ul id="list"></ul><div class="toast" id="toast">MENSAJE COPIADO</div>
<script>
const G=[{"n": "Yesid & Rosalba", "p": 2}, {"n": "Raquel & Diego", "p": 2}, {"n": "Andres, Ximena & Emma", "p": 3}, {"n": "Julio & Luz Marina", "p": 2}, {"n": "Luis Carlos & Sandra", "p": 2}, {"n": "Pedro & Adriana", "p": 4}, {"n": "Michell & Esperanza", "p": 2}, {"n": "Leonardo Romero", "p": 2}, {"n": "Andres & Paola", "p": 4}, {"n": "Luis Fernando & Nubia", "p": 2}, {"n": "Samuel Duran", "p": 1}, {"n": "Shirly & Maira", "p": 2}, {"n": "Diego & Stefannia", "p": 3}, {"n": "Manuel & Flor", "p": 2}, {"n": "Fabian & Adriana", "p": 2}, {"n": "Vanessa & Camilo", "p": 2}, {"n": "Fabian & Liliana", "p": 2}, {"n": "Martha Prato", "p": 1}, {"n": "Hilda & Esposo", "p": 2}, {"n": "Paola e hija", "p": 2}];const BASE='https://invitacionesconhistorias.github.io/bodajhonnyykaren/';
const link=g=>BASE+'?pases='+g.p+'&invitados='+encodeURIComponent(g.n);
const msg=g=>'🤍🌿 ¡Nos casamos! 🌿🤍\n\nLa vida cruzó nuestros caminos y hoy elegimos caminar juntos para toda la vida. Queremos compartir este día tan especial contigo.\n\n💍 Jhonny & Karen\n📅 Sábado 12 de diciembre de 2026\n🕛 11:00 a. m.\n📍 Rancho & Leña · Barrio Colsag, Cúcuta\n\nAbre tu invitación aquí 👇\n'+link(g)+'\n\n¡Te esperamos! 💌';
let sent={};try{sent=JSON.parse(localStorage.getItem('jk_sent')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('jk_sent',JSON.stringify(sent))}catch(e){}};
const CP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>';
const WA='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>';
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1500);}
function render(){const ul=document.getElementById('list');ul.innerHTML='';let tot=0,env=0;
 G.forEach((g,i)=>{tot+=g.p;if(sent[i])env++;const li=document.createElement('li');if(sent[i])li.className='done';
  li.innerHTML='<span class="num">'+(i+1)+'</span><div><div class="nm"></div><div class="cp">'+g.p+(g.p===1?' CUPO':' CUPOS')+'</div></div><div class="acts"><button id="cp'+i+'" aria-label="Copiar mensaje de '+g.n.replace(/"/g,'')+'">'+CP+'</button><a class="wa" target="_blank" rel="noopener" href="https://api.whatsapp.com/send?text='+encodeURIComponent(msg(g))+'">'+WA+'ENVIAR</a></div><label class="chk"><input type="checkbox" id="env'+i+'"'+(sent[i]?' checked':'')+'> Ya se envió</label>';
  li.querySelector('.nm').textContent=g.n;
  li.querySelector('button').onclick=()=>{const txt=msg(g);const ok=()=>toast('MENSAJE COPIADO');const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let done=false;try{done=document.execCommand('copy')}catch(e){}ta.remove();done?ok():toast('NO SE PUDO COPIAR');};try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}};
  li.querySelector('a.wa').addEventListener('click',()=>{sent[i]=true;save();setTimeout(render,300);});
  li.querySelector('input').onchange=e=>{sent[i]=e.target.checked;save();render();};
  ul.appendChild(li);});
 document.getElementById('sInv').textContent=G.length+' INVITACIONES';document.getElementById('sCup').textContent=tot+' CUPOS';document.getElementById('sEnv').textContent=env+' ENVIADAS';
 document.getElementById('prog').style.width=(env/G.length*100)+'%';}
render();
</script>
</body>
</html>
